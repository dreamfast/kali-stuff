; polybar config: Kali i3 box, dexpota palette. Top bar:
;   left = i3 chips · center = clock · right = target cpu mem net pulse tray
; i3's bar{} is disabled in i3.config (i3bar stays blank with polybar 3.x);
; launched there via launch.sh + for_window pin. picom shadow-excludes Polybar.
; TRAP: font-1 family is literally "Font Awesome 6 Free Solid", no
; ":style=Solid" suffix (fontconfig falls back, drops all PUA glyphs); no Nerd Fonts.

[global/wm]
name = i3

[colors]
bg        = #0a0c11
fg        = #ada37a
accent    = #cc8a3e
chip      = #172539
dim       = #555555
dimtext   = #888888
urgent    = #d33060

[bar/top]
width     = 100%
height    = 32
radius    = 14
padding-left = 2
padding-right = 2
module-margin-left = 1
module-margin-right = 1
bottom    = false
monitor   =
background = #0a0c11
foreground = #ada37a
font-0 = "monospace:size=11;2"
font-1 = "Font Awesome 6 Free Solid:size=11;2"
modules-left = i3
modules-center = date
modules-right = target cpu memory network vpn
; tray is a module in polybar 3.x; no bar-level tray-position

; i3 workspace chips, dexpota styling: dim digit on the chip
[module/i3]
type = internal/i3
format = <label-state> <label-mode>
label-mode = %mode%
label-mode-foreground = #cc8a3e
label-focused = %name%
label-focused-background = #cc8a3e
label-focused-foreground = #0a0c11
label-focused-padding = 2
label-occupied = %name%
label-occupied-foreground = #ada37a
label-occupied-padding = 2
label-visible = %name%
label-visible-foreground = #ada37a
label-visible-padding = 2
label-empty = %name%
label-empty-foreground = #555555
label-empty-padding = 2
label-urgent = %name%
label-urgent-foreground = #d33060
label-urgent-padding = 2

[module/date]
type = internal/date
interval = 1
date = %A %d %B
time = %H:%M:%S
label = " %date%  %time%"
foreground = #cc8a3e

; focused tmux pane target ("box · ip"): the zsh hook rewrites
; /tmp/nb-current-target; tail -F pushes updates without polling
[module/target]
type = script/exec
exec = /home/kali/.local/bin/polybar-target
format-prefix = "  "
format-prefix-foreground = #cc8a3e
label = " %output%"
foreground = #f3dab1

[module/cpu]
type = internal/cpu
interval = 2
label = "  %percentage%%"

[module/memory]
type = internal/memory
interval = 2
label = "  %percentage_used%%"
warn-on-threshold = false

[module/network]
type = internal/network
interface = eth0
interval = 1
label-connected = "  %downspeed:2%  %upspeed:2%"
label-connected-foreground = #cc8a3e
label-disconnected = "  down"
label-disconnected-foreground = #d33060
interval-disconnected = 5

; VM has no battery (/sys/class/power_supply empty); enable here if ever:
; [module/battery]
; type = internal/battery
; battery = BAT0
; adapter = AC
; label-charging  = "  %percentage%%"
; label-discharging = "  %percentage%%"
; label-full      = "  full"

[module/vpn]
type = custom/script
interval = 3
; HTB/lab VPN: tun0 address when up (green), dim "off" otherwise.
; Click the chip → polybar-vpn copy: IP onto the clipboard, dunst confirms
; (keeps the bar line + the click action in ONE place, same tun0 parsing)
exec = /home/kali/.local/bin/polybar-vpn status
click-left = /home/kali/.local/bin/polybar-vpn copy
