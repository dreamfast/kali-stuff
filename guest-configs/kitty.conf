# minimal kitty config.
font_size 11
scrollback_lines 10000
allow_remote_control yes
# listen_on: abstract socket → `kitty @` works from any shell (kt helper).
# TRAP: opacity is a 0.0-1.0 fraction, blur an INT pixel radius; 0.15 does
# NOT parse and kitty rejects the whole config on it.
background_opacity 0.8

# GPU-era rice (virgl on RTX 2060, 2026-10-02): inner padding keeps text off
# the rounded corners; cursor trail is a GPU shader (llvmpipe couldn't);
# powerline tabs use the palette (kitty draws separators itself — no glyph
# font needed). Bad option values make kitty reject the WHOLE config.
window_padding_width 10
cursor_trail 3
cursor_trail_decay 0.1 0.45
tab_bar_style powerline
tab_bar_min_tabs 2
active_tab_foreground #0a0c11
active_tab_background #cc8a3e
inactive_tab_foreground #888888
inactive_tab_background #172539
tab_bar_background #0a0c11
# background_blur 3
# copy on select, paste with ctrl+shift+v (tmux-ish muscle memory)
map ctrl+shift+v paste_from_clipboard
listen_on unix:


include dexpota-theme.conf
