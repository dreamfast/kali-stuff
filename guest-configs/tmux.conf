# ~/.tmux.conf: Kali attack box (tmux 3.7b, CTF/OSCP oriented)
# prefix = F12 (single key, no chord) · C-a alias · | / - split (keeps cwd) · x / X kill pane/window
# P / N prev/next window · ( / ) swap window up/down · [ / ] prev/next session
# r reload · d detach · F tmux-fzf menu · < window ops · > pane ops
# C-h/j/k/l = vim-tmux-navigator (no prefix; crosses vim splits too)
# resurrect: prefix C-r/C-s restore/save · continuum auto-saves every 15 min

# --- basics ---
set -sg escape-time 0            # no ESC delay for vim/less (session-global, tmux 3.2+)
set -g default-terminal "xterm-256color"
set -g focus-events on
set -g history-limit 50000
set -g display-time 2000
set -g repeat-time 500
set -g status-interval 5
set -g allow-passthrough on
set -g set-titles on
set -g set-titles-string "#S: #W"

# --- prefixes: F12 (single key; C-b was a two-hand reach) + C-a alias ---
set -g prefix F12
set -g prefix2 C-a
bind C-a send-prefix -2
bind F12 send-prefix
# (need C-b back for tutorial muscle memory? prefix2 C-b does it)

# --- indexing ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- mouse (SPICE: click panes/windows, drag borders, wheel scroll) ---
set -g mouse on

# --- quiet box: no bells/flash ---
set -g bell-action none
setw -g monitor-bell off
setw -g monitor-activity off
set -g visual-activity off

# --- clipboard: tmux yank -> OSC52 -> kitty -> spice-vdagent -> host clipboard ---
set -g set-clipboard on

# --- splits keep cwd ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- vim-style resize (h/j/k/l are taken by vim-tmux-navigator) ---
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# --- misc bindings ---
bind x kill-pane
bind X kill-window
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"
bind P previous-window
bind N next-window
# swap window up/down (arithmetic: this tmux build predates {+}/{-} targets)
bind ( run-shell 'wi=$(tmux display -p "#{window_index}"); if [ "$wi" -gt 1 ]; then tmux swap-window -t $((wi-1)); fi'
bind ) run-shell 'wi=$(tmux display -p "#{window_index}"); tmux swap-window -t $((wi+1)) 2>/dev/null'
# previous/next session
bind [ switch-client -r
bind ] switch-client -n

# --- copy mode: vi keys, yank to system clipboard (OSC52) ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard"
bind -T copy-mode-vi Escape send -X cancel
# (this build has no word-characters option; default separators are fine)

# --- status bar: FROSTED (bg=default = transparent over kitty 0.8 + picom
# blur); amber session chip, live box target, powerline-free window chips ---
set -g status on
set -g status-style "bg=default,fg=#ada37a"
set -g status-left-length 60
set -g status-left "#[fg=#0a0c11,bg=#cc8a3e,bold] #S #[default]"
set -g status-right-length 80
# target only — clock lives in polybar up top
set -g status-right "#[fg=#f3dab1]#(cat /tmp/nb-current-target 2>/dev/null)#[default]"
setw -g window-status-format "#[fg=#888888] #I #W #[default]"
setw -g window-status-current-format "#[fg=#0a0c11,bg=#cc8a3e,bold] #I #W #[default]"
setw -g window-status-separator ""
setw -g window-status-current-style ""
set -g mode-style "fg=#0a0c11,bg=#cc8a3e"
set -g message-style "fg=#f3dab1,bg=#172539"
set -g message-command-style "fg=#f3dab1,bg=#172539"

# --- per-pane ACTIVITY header ---
# 2026-10-02: the border no longer shows box·ip·stage — that was tripled
# TRAP: panes run wrec→script→zsh (recording), so #{pane_current_command}
# is forever "script" and #{pane_current_path} is frozen at the creation dir;
# the pane-cmd helper walks the inner pty instead (cached ≤ status-interval 5s)
# (status-left session chip, status-right target, prompt ─(BOX·STAGE)).
# Header now shows what nothing else does: pane id · RUNNING COMMAND · cwd
# (the prompt is invisible while a command runs; busy panes are obvious at
# a glance). The zsh pane TITLE is still set (box · ip · stage) and still
# feeds polybar via /tmp/nb-current-target — only the border display changed.
set -g pane-border-status top
set -g pane-border-style "bg=default,fg=#555555"
set -g pane-active-border-style "bg=default,fg=#cc8a3e"
setw -g pane-border-format " #[fg=#566d8c]#I.#P #[fg=#cc8a3e]#(pane-cmd #{pane_id} cmd)#[fg=#566d8c]· #[fg=#888888]#(pane-cmd #{pane_id} path)#[default] "

# --- plugins (standalone clones in ~/.tmux/plugins) ---
# vim-tmux-navigator, INLINED: master needs bash but tmux sources configs with
# /bin/sh (v1.0 has no standalone .tmux entrypoint); C-h/j/k/l cross panes AND vim splits
is_vim='ps -o state= -o comm= -t "#{pane_tty}" | grep -iqE "^[^TXZ ]+ +(\S+\/)?g?(view|l?n?vim?x?|fzf)(diff)?$"'
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
# tmux-fzf: prefix f/F/C-h/C-s pickers (search history, switch sessions)
run '~/.tmux/plugins/tmux-fzf/main.tmux'
# tmux-resurrect: prefix C-r restore, prefix C-s save (layout + programs)
run '~/.tmux/plugins/tmux-resurrect/resurrect.tmux'
set -g @resurrect-capture-pane-contents on   # re-paste captured output on restore
run '~/.tmux/plugins/tmux-continuum/continuum.tmux'
# auto-restore OFF: restored sessions raced with newbox; kill-server +
# newbox instead (auto-SAVE stays on; manual restore = prefix C-r)
set -g @continuum-restore off
set -g @continuum-save-interval 15

# === TERMLOG-START ===
# every pane auto-records via `script` (wrec) → ~/work/termlogs/<session>/;
# PATH self-heal inside default-command. Disable: comment that line.
set -g default-command 'sh -c "export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/home/kali/.local/bin; exec /home/kali/.local/bin/wrec"'
# === TERMLOG-END ===
