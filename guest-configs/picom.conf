# picom v13 · glx + virgl rice · 2026-10-02
# Rewritten for the GPU era: llvmpipe/xrender days are over (virgl on RTX 2060
# now), so blur + corners + fades are ON. v13 traps still apply: per-window
# opts live in `rules` only; `blur:` is a top-level section; --config is
# long-only on the CLI (-c means --shadow!). Safe restart: pkill picom, wait,
# picom -b (or Super+Shift+R); SIGUSR1 re-reads nothing, full restart needed.
backend = "glx";
vsync = true;

# soft ambient shadow, slightly tighter than the xrender one
shadow = true;
shadow-radius = 14;
shadow-opacity = 0.40;
shadow-color = "#0a0c11";
shadow-offset-x = 6;
shadow-offset-y = 6;

# quick, subtle fades (open/close + opacity changes)
fade = true;
fade-in-step = 0.08;
fade-out-step = 0.05;
fade-delta = 4;

# rounded corners (fullscreen is excluded by picom itself)
corner-radius = 10;

# blur behind translucent windows — dual_kawase is cheap on a real GPU
blur:
{
  method = "dual_kawase";
  strength = 8;
};

# unredir-if-possible dropped: it fights blur/corners and flickers fullscreen

rules = (
    # docks + desktop: no effects at all
    { match = "window_type = 'dock' || window_type = 'desktop'";
      shadow = false; corner-radius = 0; blur-background = false; dim = 0; },
    # polybar: frosted pill — translucent, blurred behind, rounded, unshadowed
    { match = "class_i = 'Polybar'";
      opacity = 0.85; shadow = false; corner-radius = 14; blur-background = true; dim = 0; },
    # gentle focus dim on everything unfocused (amber theme: reads as depth)
    { match = "!focused"; dim = 0.10; },
    # kitty: blurred backdrop, shadow under translucent parts
    { match = "class_i = 'kitty'";
      blur-background = true; full-shadow = true; },
    # rofi: frosted (rofi rounds its own corners; keep picom's clip at 0)
    { match = "class_i = 'rofi'";
      blur-background = true; corner-radius = 0; dim = 0; },
    # dialogs/popups/notifications: blur behind + shadow
    { match = "window_type = 'dialog' || window_type = 'utility' || window_type = 'popup_menu' || window_type = 'notification'";
      blur-background = true; shadow = true; },
)
