# Pin 1920x1080 on the virtio GPU (modesetting driver).
# To go back to dynamic (guest follows your SPICE window size):
#   sudo rm /etc/X11/xorg.conf.d/10-virtio.conf && sudo systemctl restart lightdm
Section "Monitor"
    Identifier "Virtual"
    Modeline "1920x1080" 173.00  1920 2048 2248 2576  1080 1083 1088 1120  -hsync +vsync
    Option "PreferredMode" "1920x1080"
EndSection
Section "Screen"
    Identifier "Screen"
    SubSection "Display"
        Depth 24
        Modes "1920x1080"
    EndSubSection
EndSection
